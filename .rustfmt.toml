max_width = 140
indent_style = "Block"

normalize_comments = true

reorder_imports = false
brace_style = "PreferSameLine"
comment_width = 100

# Struct formatting: align fields and preserve struct names in camelCase
struct_field_align_threshold = 20
struct_lit_single_line = false

edition = "2021"

use_try_shorthand = true

reorder_modules = false
reorder_impl_items = false
merge_derives = true

array_width = 140
chain_width = 140
fn_call_width = 140

fn_params_layout = "Tall"
use_field_init_shorthand = true
match_block_trailing_comma = false
match_arm_leading_pipes = "Never"

attr_fn_like_width = 70
single_line_if_else_max_width = 50
single_line_let_else_max_width = 50
struct_variant_width = 35

disable_all_formatting = false

newline_style = "Unix"
use_small_heuristics = "Default"
ignore = []

unstable_features = true
control_brace_style = "AlwaysSameLine"
imports_layout = "Mixed"
group_imports = "Preserve"
binop_separator = "Front"
blank_lines_upper_bound = 1
blank_lines_lower_bound = 0
hex_literal_case = "Preserve"
float_literal_trailing_zero = "Preserve"
skip_macro_invocations = []

# Note: Struct names must be manually kept in camelCase (PascalCase).
# Rustfmt does not enforce naming conventions; ensure struct definitions follow naming guidelines.
